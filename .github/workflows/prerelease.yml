name: XeonMovies Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assemblePrereleaseRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XeonMovies-APK
          path: app/build/outputs/apk/prerelease/release/*.apk
          if-no-files-found: error
