name: XeonMovies Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare XeonMovies launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          set -e

          for source in main prerelease debug; do
            mkdir -p "app/src/$source/res/mipmap-mdpi"
            mkdir -p "app/src/$source/res/mipmap-hdpi"
            mkdir -p "app/src/$source/res/mipmap-xhdpi"
            mkdir -p "app/src/$source/res/mipmap-xxhdpi"
            mkdir -p "app/src/$source/res/mipmap-xxxhdpi"
          done

          convert logo.png -resize 48x48\! app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert logo.png -resize 72x72\! app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert logo.png -resize 96x96\! app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert logo.png -resize 144x144\! app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert logo.png -resize 192x192\! app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          for source in prerelease debug; do
            cp app/src/main/res/mipmap-mdpi/ic_launcher.png "app/src/$source/res/mipmap-mdpi/ic_launcher.png"
            cp app/src/main/res/mipmap-hdpi/ic_launcher.png "app/src/$source/res/mipmap-hdpi/ic_launcher.png"
            cp app/src/main/res/mipmap-xhdpi/ic_launcher.png "app/src/$source/res/mipmap-xhdpi/ic_launcher.png"
            cp app/src/main/res/mipmap-xxhdpi/ic_launcher.png "app/src/$source/res/mipmap-xxhdpi/ic_launcher.png"
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png "app/src/$source/res/mipmap-xxxhdpi/ic_launcher.png"

            cp app/src/main/res/mipmap-mdpi/ic_launcher_round.png "app/src/$source/res/mipmap-mdpi/ic_launcher_round.png"
            cp app/src/main/res/mipmap-hdpi/ic_launcher_round.png "app/src/$source/res/mipmap-hdpi/ic_launcher_round.png"
            cp app/src/main/res/mipmap-xhdpi/ic_launcher_round.png "app/src/$source/res/mipmap-xhdpi/ic_launcher_round.png"
            cp app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png "app/src/$source/res/mipmap-xxhdpi/ic_launcher_round.png"
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png "app/src/$source/res/mipmap-xxxhdpi/ic_launcher_round.png"
          done

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assemblePrereleaseDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XeonMovies-APK
          path: app/build/outputs/apk/prerelease/debug/*.apk
          if-no-files-found: error
